################################################################################
# Microsoft Agent Platform Advisor — Matriz de pontuação
# Plataformas: Agent Builder (agent_builder), Microsoft 365 Copilot (m365_copilot),
#              Copilot Studio (copilot_studio), Microsoft Foundry (foundry),
#              Databricks Agent Bricks (databricks)
#
# Databricks Agent Bricks é a opção não-Microsoft da matriz. Ele só é pontuado
# quando o cenário está ancorado na plataforma de dados — um agente de conhecimento
# ou raciocínio governado pelo lakehouse, criado e servido pelo time que é dono dos
# dados. Ele não consegue se fundamentar em conteúdo do Microsoft 365 nem publicar
# no Microsoft 365 Copilot, então essas respostas o zeram da mesma forma que os
# limites das outras plataformas são aplicados.
#
# Escala de pontos: 0 = não serve · 1 = sinal fraco · 2 = moderado · 3 = forte
# Pontuação bruta máxima por plataforma: 15 (5 perguntas × máx. 3)
################################################################################

meta:
  version: "1.2"
  platforms:
    - id: agent_builder
      label: Agent Builder
    - id: m365_copilot
      label: Microsoft 365 Copilot
    - id: copilot_studio
      label: Copilot Studio
    - id: foundry
      label: Microsoft Foundry
    - id: databricks
      label: Databricks Agent Bricks

################################################################################
# PERGUNTAS
################################################################################

questions:

  - id: q1
    label: Quem vai criar este agente?
    purpose: Define o peso do perfil para interpretar as respostas seguintes
    prompt: Algumas plataformas são feitas para criadores que usam ferramentas low-code, enquanto outras exigem habilidades de desenvolvimento profissional.
    options:
      - id: q1a
        label: Usuário de negócio ou especialista no assunto — sem experiência em programação
        scores:
          agent_builder: 3
          copilot_studio: 1
          foundry: 0
          databricks: 1

      - id: q1b
        label: Criador low-code ou profissional de TI — à vontade com ferramentas de arrastar e soltar e configuração
        scores:
          agent_builder: 1
          copilot_studio: 3
          foundry: 0
          databricks: 1

      - id: q1c
        label: Desenvolvedor profissional — escreve código e constrói software
        scores:
          agent_builder: 0
          copilot_studio: 2
          foundry: 3
          databricks: 2

      - id: q1d
        label: Cientista de dados ou engenheiro de IA/ML — trabalha com modelos de IA e infraestrutura de dados
        scores:
          agent_builder: 0
          copilot_studio: 1
          foundry: 3
          databricks: 3

      - id: q1e
        label: Time de plataforma de dados ou engenharia de dados — é dono do lakehouse, dos pipelines e da governança de dados
        scores:
          agent_builder: 0
          copilot_studio: 1
          foundry: 2
          databricks: 3

  - id: q8
    label: Quem vai usar este agente?
    purpose: Público externo é uma restrição rígida que afeta a elegibilidade da plataforma
    prompt: Este agente será usado por um pequeno grupo interno, por um público interno amplo ou por usuários externos como clientes e parceiros?
    hard_rules:
      - condition: option in [q8b]
        effect: >
          Zera agent_builder e m365_copilot.
          O Agent Builder não tem caminho de publicação externa.
          O Microsoft 365 Copilot é restrito ao tenant.
    options:
      - id: q8a
        label: Eu ou um pequeno time interno — um agente rápido para um grupo delimitado
        scores:
          agent_builder: 3
          copilot_studio: 2
          foundry: 1
          databricks: 1

      - id: q8c
        label: Uma área ou um público interno amplo — muitos funcionários precisam de um agente gerenciado
        scores:
          agent_builder: 1
          copilot_studio: 3
          foundry: 2
          databricks: 2

      - id: q8b
        label: Usuários externos — clientes, parceiros ou o público em geral
        scores:
          agent_builder: 0
          copilot_studio: 3
          foundry: 3
          databricks: 2
        hard_rule_trigger: true

      - id: q8d
        label: Ainda não decidido
        scores:
          agent_builder: 2
          copilot_studio: 2
          foundry: 1
          databricks: 1

  - id: q2
    label: Onde as pessoas vão interagir com este agente?
    purpose: A superfície de implantação costuma ser uma restrição rígida
    prompt: Pense em onde as pessoas vão acessar ou usar o agente no dia a dia de trabalho.
    hard_rules:
      - condition: option in [q2a]
        effect: >
          Zera databricks.
          Agentes do Agent Bricks são servidos pelo Databricks — não há caminho
          nativo de publicação no chat do Microsoft 365 Copilot.
    options:
      - id: q2a
        label: Dentro do chat do Microsoft 365 Copilot — Microsoft365.com, Office.com ou Teams desktop/web
        scores:
          agent_builder: 3
          copilot_studio: 3
          foundry: 2
          databricks: 0
        hard_rule_trigger: true

      - id: q2b
        label: Em um app personalizado — um site ou aplicativo móvel construído pelo seu time
        scores:
          agent_builder: 0
          copilot_studio: 3
          foundry: 3
          databricks: 3

      - id: q2c
        label: Rodando automaticamente em segundo plano — disparado por eventos, não por alguém conversando com ele
        scores:
          agent_builder: 0
          copilot_studio: 3
          foundry: 3
          databricks: 2

      - id: q2d
        label: Em vários lugares, ou ainda não decidido
        scores:
          agent_builder: 1
          copilot_studio: 3
          foundry: 3
          databricks: 1

      - id: q2e
        label: No seu ambiente de dados e analytics — notebooks, BI e exploração de dados em linguagem natural, ou um endpoint de agente governado servido pela sua plataforma de dados
        scores:
          agent_builder: 0
          copilot_studio: 1
          foundry: 2
          databricks: 3
        hard_rule_trigger: true

  - id: q4
    label: O que este agente deve fazer?
    purpose: Maior fator de diferenciação entre Copilot Studio e Foundry
    prompt: Que tipo de trabalho você quer que este agente execute? Escolha a opção que representa a tarefa mais avançada que você espera dele.
    hard_rules:
      - condition: option == q4d
        effect: >
          Define foundry = 3. Limita agent_builder e m365_copilot a 0
          independentemente das outras respostas.
      - condition: option == q4f
        effect: >
          Limita agent_builder a 0. Extração em larga escala sobre coleções de documentos,
          consultas em linguagem natural a tabelas governadas e ajuste de qualidade sobre
          seus próprios dados estão fora do que um agente declarativo do Microsoft 365 faz.
    options:
      - id: q4a
        label: Responder perguntas em uma única interação — perguntas e respostas, consultas ou resumos
        scores:
          agent_builder: 3
          copilot_studio: 3
          foundry: 1
          databricks: 2

      - id: q4b
        label: Manter uma conversa de ida e volta e lembrar do contexto
        scores:
          agent_builder: 2
          copilot_studio: 3
          foundry: 2
          databricks: 2

      - id: q4e
        label: Criar ou analisar conteúdo dentro do Copilot — documentos, gráficos, imagens ou análise leve de dados
        scores:
          agent_builder: 3
          copilot_studio: 2
          foundry: 2
          databricks: 1

      - id: q4c
        label: Concluir tarefas de várias etapas — seguir um processo, consultar vários sistemas ou executar ações como enviar formulários e atualizar registros
        scores:
          agent_builder: 0
          copilot_studio: 3
          foundry: 3
          databricks: 2

      - id: q4d
        label: Gerenciar fluxos complexos — coordenar múltiplos agentes ou lidar com processos de longa duração
        scores:
          agent_builder: 0
          copilot_studio: 2
          foundry: 3
          databricks: 3
        hard_rule_trigger: true

      - id: q4f
        label: Raciocinar sobre grandes volumes de dados corporativos — extrair campos estruturados de coleções de documentos, responder perguntas sobre tabelas governadas ou ajustar a qualidade das respostas com seus próprios dados
        scores:
          agent_builder: 0
          copilot_studio: 1
          foundry: 2
          databricks: 3
        hard_rule_trigger: true

  - id: q3
    label: A que informações este agente precisa acessar?
    purpose: Os requisitos de fundamentação reduzem as opções rapidamente
    prompt: Onde estão hoje as informações de que este agente precisa? Escolha a opção mais próxima de onde elas estão atualmente.
    hard_rules:
      - condition: option in [q3a, q3b, q3d]
        effect: >
          Zera databricks.
          O Agent Bricks se fundamenta em dados do lakehouse e documentos governados
          no Unity Catalog. Não há caminho nativo de fundamentação em conteúdo do
          Microsoft 365 nem nos conectores do Microsoft 365 Copilot.
    options:
      - id: q3a
        label: Conteúdo do Microsoft 365 — SharePoint, OneDrive, Teams, Outlook ou dados de pessoas
        scores:
          agent_builder: 3
          copilot_studio: 2
          foundry: 1
          databricks: 0
        hard_rule_trigger: true

      - id: q3b
        label: Sistemas de negócio já disponíveis pelos conectores do Microsoft 365 Copilot — como Jira, ServiceNow, GitHub ou Azure DevOps
        scores:
          agent_builder: 2
          copilot_studio: 3
          foundry: 2
          databricks: 0
        hard_rule_trigger: true

      - id: q3c
        label: Dataverse, conectores personalizados ou APIs de negócio que seu time pode expor ao agente
        scores:
          agent_builder: 0
          copilot_studio: 3
          foundry: 2
          databricks: 1

      - id: q3d
        label: Uma mistura — conteúdo do Microsoft 365 mais sistemas de negócio via conectores
        scores:
          agent_builder: 2
          copilot_studio: 3
          foundry: 2
          databricks: 0
        hard_rule_trigger: true

      - id: q3e
        label: Sites públicos ou arquivos enviados — fontes web delimitadas, PDFs, arquivos do Office ou outro conteúdo incorporado
        scores:
          agent_builder: 3
          copilot_studio: 2
          foundry: 1
          databricks: 1

      - id: q3f
        label: RAG personalizado, Azure AI Search, índices privados, bases de conhecimento do Foundry IQ ou recuperação em larga escala gerenciada pela engenharia
        scores:
          agent_builder: 0
          copilot_studio: 1
          foundry: 3
          databricks: 2

      - id: q3g
        label: Seu lakehouse ou data warehouse — tabelas do Databricks Unity Catalog, tabelas Delta ou grandes coleções de documentos governadas junto com elas
        scores:
          agent_builder: 0
          copilot_studio: 1
          foundry: 2
          databricks: 3
        hard_rule_trigger: true

################################################################################
# MOTOR DE PONTUAÇÃO
################################################################################

scoring:

  # Passo 1 — As regras rígidas são avaliadas antes da soma.
  # Elas limitam ou zeram plataformas independentemente da pontuação acumulada.
  # Regras rígidas representam limitações reais das plataformas, não preferências.
  hard_rule_evaluation: pre_sum
  hard_rules:
    q4d:
      zero: [agent_builder, m365_copilot]
      label: "Orquestração complexa de agentes — Agent Builder e M365 Copilot não são adequados para orquestração multiagente ou de longa duração"
    q4c:
      zero: [agent_builder]
      label: "Fluxos de ação de várias etapas — o Agent Builder não consegue enviar formulários, atualizar registros nem executar ações entre sistemas"
    q8b:
      zero: [agent_builder, m365_copilot]
      label: "Público de usuários externos — Agent Builder e M365 Copilot não publicam externamente"
    q2b:
      zero: [agent_builder]
      label: "Implantação em app personalizado — o Agent Builder só roda dentro do Microsoft 365"
    q2c:
      zero: [agent_builder]
      label: "Execução em segundo plano — o Agent Builder não tem recursos orientados a eventos nem autônomos"
    q3c:
      zero: [agent_builder]
      label: "Integração direta com sistemas de negócio — o Agent Builder não conecta diretamente a Dataverse, conectores personalizados ou APIs de negócio"
    q3f:
      zero: [agent_builder]
      label: "Arquitetura de recuperação personalizada — o Agent Builder não usa diretamente RAG personalizado, Azure AI Search, índices privados, Foundry IQ ou sistemas de recuperação mantidos pela engenharia"
    q3g:
      zero: [agent_builder]
      label: "Dados governados pelo lakehouse — o Agent Builder não consulta Unity Catalog, tabelas Delta nem coleções de documentos governadas pelo warehouse"
    q3a:
      zero: [databricks]
      label: "Conteúdo do Microsoft 365 — o Agent Bricks se fundamenta em dados do lakehouse, não em SharePoint, OneDrive, Teams ou Outlook"
    q3b:
      zero: [databricks]
      label: "Conectores do Microsoft 365 Copilot — o Agent Bricks não consome o catálogo de conectores do Microsoft 365"
    q3d:
      zero: [databricks]
      label: "Conteúdo do Microsoft 365 mais conectores — o Agent Bricks não tem caminho de fundamentação em fontes do Microsoft 365"
    q2a:
      zero: [databricks]
      label: "Implantação no chat do Microsoft 365 Copilot — agentes do Agent Bricks são servidos pelo Databricks e não têm caminho nativo de publicação no Microsoft 365 Copilot"
    q2e:
      zero: [agent_builder]
      label: "Ambiente de dados e analytics — o Agent Builder só roda dentro do Microsoft 365, não em notebooks, BI ou endpoints da plataforma de dados"
    q4f:
      zero: [agent_builder]
      label: "Raciocínio sobre dados em larga escala — o Agent Builder não faz extração em escala sobre coleções de documentos, não consulta tabelas governadas nem ajusta a qualidade das respostas com seus dados"
  # Passo 2 — Soma as pontuações brutas de todas as perguntas respondidas.
  raw_score_max: 15  # 5 perguntas × pontuação máxima de 3

  # Passo 2.5 — Preferências por perfil: ajustes suaves que forçam uma plataforma
  # acima de outra quando um perfil específico é selecionado. Diferente das regras
  # rígidas, as pontuações são preservadas. Uma justificativa explica o ajuste.
  persona_preferences:
    - when:
        q1: q1d
      prefer: copilot_studio
      over: agent_builder
      rationale: >
        O Copilot Studio é recomendado no lugar do Agent Builder para cientistas de dados e
        engenheiros de IA/ML porque oferece seleção curada de modelos, avaliação de agentes,
        integração com Foundry IQ, desenvolvimento code-first pela extensão do VS Code e
        orquestração mais flexível — recursos que o Agent Builder não tem.

  # Passo 3 — Mapeia as pontuações brutas para a força da recomendação.
  recommendation_thresholds:
    - min: 12
      max: 15
      label: Encaixe forte
      description: Esta plataforma está bem alinhada aos seus requisitos em todas as dimensões.
    - min: 8
      max: 11
      label: Bom encaixe
      description: Esta plataforma atende à maior parte dos seus requisitos, com pequenas concessões.
    - min: 4
      max: 7
      label: Encaixe parcial
      description: Esta plataforma consegue atender ao seu cenário, mas pode exigir contornos.
    - min: 0
      max: 3
      label: Não recomendado
      description: É improvável que esta plataforma atenda aos seus requisitos neste cenário.

  # Passo 5 — Tratamento de empate: apresenta as duas como par complementar.
  tie_handling:
    threshold_points: 2
    present_as: complementary_pair
    # Critérios de desempate por perfil — aplicados antes de valid_pairs quando uma
    # resposta específica torna uma plataforma mais adequada apesar do empate.
    tiebreakers:
      - when:
          q1: q1c
        platforms: [agent_builder, copilot_studio]
        prefer: copilot_studio
        rationale: >
          Quando quem cria é um desenvolvedor profissional e as pontuações empatam,
          o Copilot Studio se encaixa melhor — ele suporta criação code-first pela
          extensão do VS Code, enquanto o Agent Builder é apenas no-code.
      - when:
          q1: q1d
        platforms: [copilot_studio, foundry]
        prefer: copilot_studio
        rationale: >
          Quando quem cria é cientista de dados ou engenheiro de IA/ML e as pontuações
          empatam, o Copilot Studio é preferido — ele oferece um caminho mais rápido até
          agentes em produção, enquanto o Foundry fica reservado para orquestração
          personalizada mais profunda.
      - when:
          q3: q3g
        platforms: [copilot_studio, databricks]
        prefer: databricks
        rationale: >
          Quando o conhecimento já está no lakehouse e as pontuações empatam,
          o Agent Bricks se encaixa melhor — ele cria e governa o agente onde os dados,
          as permissões e a linhagem já estão, em vez de exportar ou reindexar
          tudo para outra plataforma.
      - when:
          q1: q1e
        platforms: [foundry, databricks]
        prefer: databricks
        rationale: >
          Quando o time de plataforma de dados é dono do cenário e as pontuações empatam,
          o Agent Bricks mantém o agente no mesmo plano de governança dos dados,
          enquanto o Foundry acrescentaria uma segunda plataforma para operar.
    valid_pairs:
      - platforms: [copilot_studio, foundry]
        rationale: Construa no Copilot Studio e estenda com código personalizado no Foundry.
      - platforms: [m365_copilot, copilot_studio]
        rationale: Microsoft 365 Copilot para os usuários finais, Copilot Studio para personalização e extensão.
      - platforms: [agent_builder, m365_copilot]
        rationale: Agent Builder para agentes nativos do Microsoft 365, Microsoft 365 Copilot para extensibilidade mais ampla.
      - platforms: [databricks, foundry]
        rationale: Agent Bricks para raciocínio fundamentado no lakehouse sobre seus dados governados, Foundry para a aplicação, identidade, rede e publicação no Microsoft 365 do lado Azure.
      - platforms: [copilot_studio, databricks]
        rationale: Agent Bricks para raciocinar sobre os dados do lakehouse, Copilot Studio para levar essa resposta aos funcionários no Teams e no Microsoft 365.

  # Notas de contradição entre perguntas — exibidas como avisos contextuais
  # quando a combinação de respostas do usuário é logicamente contraditória.
  cross_question_notes:
    - when:
        q2: q2c
        q4: q4a
      note: >
        Você escolheu um agente em segundo plano, orientado a eventos, mas também
        perguntas e respostas simples. Agentes em segundo plano normalmente processam
        eventos automaticamente em vez de responder a perguntas de usuários. Avalie se
        o seu agente é orientado a eventos ou conversacional.
    - when:
        q8: q8b
        q2: q2a
      note: >
        Você escolheu usuários externos, mas quer o agente dentro dos aplicativos do
        Microsoft 365. Usuários externos normalmente não acessam o Teams, o SharePoint
        ou o Outlook da sua organização. Seu agente pode precisar de uma implantação
        web personalizada para alcançá-los.
    - when:
        q1: q1a
        q4: q4d
      note: >
        Orquestração complexa de múltiplos agentes normalmente exige habilidades de
        desenvolvimento profissional. Considere se apoiar no time de desenvolvimento ou
        escolher um tipo de tarefa mais simples, compatível com o seu nível de experiência.
    - when:
        q1: q1a
        q3: q3c
      note: >
        Integrações diretas com sistemas de negócio como Dataverse, conectores
        personalizados ou APIs geralmente exigem conhecimento técnico para configurar.
        Avalie se o time de TI ou de desenvolvimento vai ajudar a configurar o acesso
        aos dados do agente.
    - when:
        q1: q1a
        q3: q3f
      note: >
        Arquiteturas de recuperação personalizadas como Azure AI Search, índices privados,
        Foundry IQ ou RAG em larga escala geralmente exigem conhecimento de engenharia.
        Considere se apoiar no time de desenvolvimento ou de plataforma de dados antes
        de construir o agente.
    - when:
        q3: q3g
        q2: q2a
      note: >
        Você disse que o conhecimento está no lakehouse, mas quer o agente dentro do chat
        do Microsoft 365 Copilot. Agentes criados sobre o lakehouse são servidos pela
        plataforma de dados e não têm caminho nativo de publicação no Microsoft 365 Copilot
        — você precisaria colocar na frente um agente do Copilot Studio ou do Foundry que
        chame o endpoint da plataforma de dados.
    - when:
        q1: q1a
        q3: q3g
      note: >
        Dados do lakehouse — Unity Catalog, tabelas Delta e as permissões e linhagem em
        torno deles — normalmente pertencem a um time de plataforma de dados. Confirme
        quem pode conceder acesso a esses dados e servir o agente antes de seguir por
        este caminho.
    - when:
        q1: q1e
        q3: q3a
      note: >
        Você escolheu um time de plataforma de dados como criador, mas conteúdo do
        Microsoft 365 como fonte. Conteúdo do Microsoft 365 é acessado por conectores do
        Copilot e permissões do Graph, e não pelo lakehouse, então este cenário recai
        sobre as plataformas Microsoft mesmo que seu time seja dono do patrimônio de dados.

  # Notas de descompasso com o perfil — exibidas quando a plataforma recomendada
  # não combina com o perfil de quem vai criar o agente.
  winner_persona_notes:
    - winner: foundry
      persona: q1a
      note: >
        O Microsoft Foundry é a plataforma certa para este cenário, mas exige habilidades
        de desenvolvimento profissional e conhecimento de Azure. Considere se apoiar no
        time de desenvolvimento para construir e manter este agente.
    - winner: databricks
      persona: q1a
      note: >
        O Databricks Agent Bricks se encaixa neste cenário, mas pressupõe que sua
        organização já roda no Databricks e que alguém possa conceder ao agente acesso
        governado aos dados subjacentes. Envolva o time de plataforma de dados antes de começar.
    - winner: databricks
      persona: q1b
      note: >
        O Databricks Agent Bricks se encaixa neste cenário, mas fica fora do stack
        Microsoft em que você costuma trabalhar — um workspace Databricks, permissões do
        Unity Catalog e capacidade de serving são pré-requisitos. Envolva o time de
        plataforma de dados desde o início.

################################################################################
# TEXTOS DAS RECOMENDAÇÕES
################################################################################

recommendations:

  agent_builder:
    headline: Agent Builder
    description: Crie agentes leves em minutos sem escrever código, fundamentados em conteúdo do Microsoft 365, web delimitada, arquivos enviados e conectores do Copilot habilitados pelo administrador
    resources_url: https://microsoft.github.io/agent-resources/m365-copilot/#agent-builder
    scoring_summary: Mais adequado para agentes declarativos no-code, de pequenos times, dentro do Microsoft 365 Copilot.
    exploration_best_for: Crie agentes no-code no Microsoft 365 Copilot
    exploration_summary: >
      Escolha o Agent Builder quando quiser criar agentes sem escrever código, usando
      conteúdo do Microsoft 365, fontes web delimitadas, arquivos enviados ou dados de
      negócio já expostos pelos conectores do Microsoft 365 Copilot. Ideal para usuários
      de negócio que precisam de perguntas e respostas, resumos, consultas ou auxiliares
      leves de conteúdo e análise de dados para si mesmos ou para um pequeno time.
    summary: >
      O ponto de partida certo para usuários de negócio que querem criar agentes
      declarativos leves diretamente dentro do Microsoft 365 Copilot, sem escrever código.
    best_for:
      - Criadores no-code construindo para si mesmos ou para um pequeno time interno
      - Agentes fundamentados em conteúdo do Microsoft 365, web delimitada, arquivos enviados ou conectores do Copilot habilitados pelo administrador
      - Perguntas e respostas, resumos, consultas, orientação e cenários leves de documento, gráfico, imagem ou análise de dados
    watch_out_for:
      - Não pode ser compartilhado com pessoas de fora da sua organização
      - Agentes para áreas inteiras ou toda a organização geralmente precisam dos controles de implantação e governança do Copilot Studio
      - Dados de negócio externos precisam estar disponíveis pelos conectores do Microsoft 365 Copilot; APIs diretas, Dataverse, bancos de dados personalizados, índices de busca privados e recuperação personalizada exigem Copilot Studio ou Foundry
      - Não serve para lógica de ação personalizada, aprovações, fluxos com ramificações ou atualização de sistemas externos
      - Copie o agente para o Copilot Studio quando ele superar os limites de compartilhamento, integração, ciclo de vida ou governança do Agent Builder
      - Sem ferramentas de avaliação ou teste — a garantia de qualidade é manual
      - Sem gestão de ciclo de vida — não há versionamento, ambientes ou CI/CD
      - Observabilidade mínima — visibilidade limitada sobre o comportamento e o uso do agente
    templates:
      - label: Career Coach
        description: Planos personalizados de desenvolvimento de carreira, análise de lacunas de competências e conselhos práticos
        url: https://learn.microsoft.com/microsoft-365/copilot/extensibility/agent-template-career-coach
      - label: Corporate Communications Crafter
