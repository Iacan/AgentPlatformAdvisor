  m365_copilot:
    headline: Microsoft 365 Copilot
    description: IA nativa e sensível a permissões no Microsoft 365 Copilot Chat, Search, Word, Excel, PowerPoint, Outlook, Teams, Loop, Pages, Notebooks e nos agentes criados pela Microsoft
    resources_url: https://microsoft.github.io/agent-resources/m365-copilot/
    scoring_summary: Serve para cenários em que o chat, a busca, os apps, os notebooks e os agentes nativos do Microsoft 365 Copilot já cobrem a necessidade.
    exploration_best_for: Use IA nativa em todo o Microsoft 365
    exploration_summary: >
      Use o Microsoft 365 Copilot quando os funcionários precisarem de ajuda nativa e
      sensível a permissões no Microsoft 365 Copilot Chat, Copilot Search, Word, Excel,
      PowerPoint, Outlook, Teams, Loop, Pages, Notebooks e nos agentes criados pela
      Microsoft, como Researcher, Analyst, Facilitator e Interpreter. Ideal quando o
      trabalho pode ser resolvido pelas experiências existentes do Microsoft 365, sem
      precisar de um agente personalizado.
    summary: >
      Melhor quando os recursos nativos do Microsoft 365 Copilot já atendem à maior parte
      do que os usuários precisam — chat, busca, assistência dentro dos aplicativos,
      páginas e notebooks colaborativos e agentes criados pela Microsoft, fundamentados
      no conteúdo de trabalho permitido a cada usuário, nas fontes conectadas e na web.
    # A resposta de tipo de tarefa no wizard de ponto de entrada escolhe por qual
    # superfície do Microsoft 365 Copilot começar. O Copilot Chat e os agentes nativos
    # são superfícies deste mesmo produto, não destinos separados.
    start_here:
      chat:
        label: Copilot Chat
        url: https://learn.microsoft.com/microsoft-365/copilot/microsoft-365-copilot-overview
        tagline: Pergunte, resuma e redija no fluxo do trabalho
        description: >-
          A porta de entrada conversacional do Microsoft 365 Copilot — você pergunta, itera e
          obtém respostas, resumos e rascunhos por conta própria, com base nos seus e-mails,
          reuniões, arquivos e mensagens. Chame um agente especializado a partir daqui sempre
          que uma tarefa exigir.
      agents:
        label: Agentes nativos — Researcher, Analyst, Facilitator, Interpreter
        url: https://learn.microsoft.com/microsoft-365/copilot/researcher-agent
        tagline: Agentes feitos sob medida para trabalhos especializados
        description: >-
          Comece pelo agente criado para o trabalho — Researcher para pesquisa aprofundada com
          citação de fontes, Analyst para análise de dados em Python, Facilitator para notas e
          encaminhamentos de reunião, Interpreter para tradução ao vivo. Todos rodam dentro do
          Microsoft 365 Copilot junto com o chat, então você transita entre eles sem trocar de produto.

    best_for:
      - Perguntas, resumos e redação pontuais, iniciados pelo usuário
      - Conduzir uma tarefa você mesmo em vez de delegá-la
      - Trabalhos especializados que um agente criado pela Microsoft já resolve
      - Fundamentado no seu contexto do Microsoft 365 (e-mail, reuniões, arquivos, mensagens)
    watch_out_for:
      - Você permanece no comando — ele não executa uma tarefa de várias etapas de ponta a ponta sozinho
      - Não é sempre ativo nem monitora proativamente
      - Use o Cowork quando quiser delegar uma entrega delimitada de várias etapas
      - Use o Scout quando o trabalho precisar continuar ou agir ao longo do tempo

    first_party_label: Recursos e agentes nativos do Copilot
    first_party_agents:
      - label: Copilot Chat
        description: Chat sensível a permissões para redigir, resumir, responder perguntas e trabalhar com conteúdo do Microsoft 365 e da web
        url: https://learn.microsoft.com/microsoft-365/copilot/microsoft-365-copilot-overview
      - label: Copilot Search
        description: Busca universal com IA no Microsoft 365 e em fontes de terceiros conectadas, com consultas em linguagem natural e transição para o chat
        url: https://learn.microsoft.com/microsoft-365/copilot/microsoft-365-copilot-search
      - label: Copilot Pages e Notebooks
        description: Espaços de trabalho persistentes e compartilháveis para sintetizar conteúdo e fundamentar o Copilot em material curado; armazenados em containers do SharePoint Embedded/Loop
        url: https://learn.microsoft.com/microsoft-365/loop/cpcn-requirements
      - label: Sales agent
        description: Produtividade de vendas no Teams, Outlook e aplicativos de CRM
        url: https://learn.microsoft.com/microsoft-sales-copilot/
      - label: Service agent
        description: Apoio ao atendimento ao cliente em todos os canais de suporte
        url: https://learn.microsoft.com/microsoft-copilot-service/
      - label: Finance agent
        description: Fluxos financeiros, análise e conciliação no Excel e no Outlook
        url: https://learn.microsoft.com/copilot/finance/
      - label: Employee Self-Service Agent
        description: Autoatendimento de RH e TI dentro do Teams para políticas, dúvidas frequentes e solicitações
        url: https://learn.microsoft.com/copilot/microsoft-365/employee-self-service/overview
      - label: SharePoint Agent
        description: Perguntas e respostas fundamentadas em um site ou biblioteca de documentos específica do SharePoint
        url: https://support.microsoft.com/office/get-started-with-sharepoint-agents-69e2faf9-2c1e-4baa-8305-23e625021bcf
      - label: Facilitator Agent
        description: Facilitação de reuniões, notas colaborativas em tempo real, perguntas e respostas, marcadores de linha do tempo, itens de ação e integrações em preview com Planner/Word no Teams
        url: https://learn.microsoft.com/microsoftteams/facilitator-teams
      - label: Researcher Agent
        description: Faz pesquisas mais profundas, de várias etapas e com citação de fontes, na web e no conteúdo de trabalho, gerando relatórios estruturados, visuais e recomendações
        url: https://learn.microsoft.com/microsoft-365/copilot/researcher-agent
      - label: Analyst Agent
        description: Transforma dados complexos em insights, gráficos e visualizações claras usando Python
        url: https://techcommunity.microsoft.com/blog/microsoft365copilotblog/analyst-agent-in-microsoft-365-copilot/4397191
      - label: Interpreter Agent
        description: Interpretação simultânea de fala em reuniões do Teams em nove idiomas, com simulação de voz opcional e capacidade mensal inclusa
        url: https://learn.microsoft.com/microsoftteams/interpreter-agent-teams
      - label: Project Manager Agent
        description: Automatiza a criação de planos de projeto, o acompanhamento de tarefas e os relatórios de status no Planner (preview)
        url: https://aka.ms/agents/ProjectManagerDocs
      - label: Channel Agent
        description: Especialista em canais do Teams para resumir conversas, gerenciar tarefas e aumentar a produtividade (preview)
        url: https://support.microsoft.com/office/get-started-with-channel-agent-for-teams-channels-b85945cf-deef-4f1e-9db1-66e1a23b6a65
      - label: Community Agent
        description: Acelera o compartilhamento de conhecimento e revela expertise nas comunidades da organização no Viva Engage (preview)
        url: https://learn.microsoft.com/viva/engage/ai-technology-with-viva-engage/agents-community-network-deployment-config

  copilot_studio:
    headline: Copilot Studio
    description: Crie agentes corporativos governados que combinam conhecimento, ferramentas, fluxos de trabalho, gatilhos por evento, revisão humana, agentes conectados, avaliação, monitoramento e implantação multicanal
    resources_url: https://microsoft.github.io/agent-resources/copilot-studio/
    scoring_summary: A plataforma low-code governada para agentes corporativos que precisam de ações, fluxos, conectores, avaliação, monitoramento e implantação ampla.
    exploration_best_for: Crie agentes e fluxos corporativos governados
    exploration_summary: >
      Escolha o Copilot Studio quando precisar de agentes que vão além da consulta rápida de
      conhecimento — conectando-se a CRMs, bancos de dados, APIs, servidores MCP, fluxos de
      trabalho, contexto do Microsoft 365 e outros agentes. Ótimo para criadores e times de TI
      que constroem agentes governados capazes de raciocinar, executar ações, avaliar qualidade
      e implantar em vários canais.
    summary: >
      A melhor plataforma low-code para agentes corporativos governados — conecte-se a sistemas
      externos, automatize processos de negócio, use orquestração generativa, avalie qualidade,
      monitore comportamento e implante em sites, Teams, Microsoft 365 e mais.
    best_for:
      - Criadores low-code e profissionais de TI
      - Agentes que se conectam a APIs externas, CRM, ERP, Dataverse, bancos de dados, servidores MCP ou conectores personalizados
      - Fluxos disparados por evento, agendados ou iniciados pelo usuário, com ações, ramificações, revisão humana e aprovações
      - Orquestração entre agentes — agentes filhos, agentes conectados do Copilot Studio e integrações A2A
      - Automação de aplicativos web ou desktop legados com computer use quando não existe API
      - Experiências conversacionais de múltiplos turnos com orquestração generativa, contexto do Microsoft IQ e memória opcional por usuário na nova experiência
      - Implantação para públicos internos e externos
      - Conjuntos de teste de avaliação nativos, mapas de atividade, analytics, monitoramento e inventário de agentes em todo o tenant
    watch_out_for:
      - Pipelines de ML complexos ou treinamento de modelos personalizados exigem o Foundry
      - Orquestração multiagente muito personalizada, de larga escala ou code-first é melhor atendida pelo Foundry
      - Suporta modelos curados em GA, preview e experimentais, incluindo modelos de raciocínio profundo; use o Foundry para hospedar modelos próprios arbitrários, treinar modelos personalizados, rotear modelos e ter controle total do runtime
      - A memória está disponível no preview da nova experiência, com limites de armazenamento e ciclo de vida por usuário/por agente; use o Foundry quando precisar de arquitetura de memória personalizada, retenção mais longa ou memória controlada pela aplicação
      - Computer use exige governança cuidadosa de credenciais, supervisão, controle de acesso, observabilidade e custo
      - Os Copilot Credits podem crescer rápido com respostas generativas, ações de agente, fundamentação no grafo do tenant, fluxos, modelos de raciocínio, voz e computer use
      - Use o Databricks Agent Bricks quando o conhecimento estiver em um lakehouse e precisar permanecer sob a governança do Unity Catalog; chame-o a partir do Copilot Studio para alcançar os funcionários
    persona_tips:
      q1c: >
        🛠️ <strong>Dica para desenvolvedores:</strong> você pode criar agentes do Copilot Studio em YAML usando a
        <a href="https://learn.microsoft.com/microsoft-copilot-studio/authoring-overview" target="_blank" rel="noopener noreferrer">extensão do Copilot Studio para VS Code</a>

  foundry:
    headline: Microsoft Foundry
    description: Uma plataforma de desenvolvimento e runtime gerenciado de agentes para construir, implantar, avaliar e operar agentes de nível produtivo com controle total de código, modelos, ferramentas, identidade, rede e observabilidade
    resources_url: https://microsoft.github.io/agent-resources/microsoft-foundry/
    scoring_summary: A escolha certa quando agentes em produção precisam de controle code-first, hospedagem gerenciada, recuperação personalizada, ferramentas avançadas, identidade, observabilidade ou conformidade rigorosa.
    exploration_best_for: Construa e opere sistemas agênticos de nível produtivo
    exploration_summary: >
      Escolha o Microsoft Foundry quando seu time precisar de um runtime gerenciado de agentes
      com controle total de desenvolvimento — prompt agents, agentes de código hospedados,
      protocolos personalizados, modelos do Foundry, toolboxes, MCP, Foundry IQ, rede privada,
      identidade de agente, tracing, avaliação, monitoramento e publicação no Microsoft 365 ou
      em apps personalizados. Feito para desenvolvedores profissionais, arquitetos e engenheiros de ML.
    summary: >
      A escolha certa quando seu time precisa construir e operar agentes de nível produtivo
      como software — com endpoints gerenciados, versionamento, código personalizado, acesso
      ao catálogo de modelos, recuperação personalizada, identidade de agente, rede privada,
      tracing, avaliação e monitoramento.
    best_for:
      - Desenvolvedores profissionais, arquitetos e engenheiros de ML
      - Prompt agents quando você quer que o Foundry execute o agente sem manter código de aplicação
      - Agentes hospedados quando você precisa do seu próprio código, Agent Framework, LangGraph, OpenAI Agents SDK, Anthropic Agent SDK, GitHub Copilot SDK ou frameworks personalizados
      - Agentes embarcados em aplicações próprias, serviços de backend, APIs, webhooks, sistemas de voz ou protocolos personalizados
      - RAG personalizado e recuperação corporativa com Foundry IQ, Azure AI Search, Azure Blob Storage, SharePoint, OneLake, fontes web, citações, ACLs e rótulos de confidencialidade do Purview
      - Foundry Toolboxes e pacotes de ferramentas compatíveis com MCP, com autenticação centralizada, versionamento e aplicação de políticas
      - Identidades de agente dedicadas no Microsoft Entra, RBAC, rede privada, filtros de conteúdo e uso dos seus próprios recursos do Azure
      - Ciclo de vida completo de desenvolvimento — versionamento, endpoints estáveis, rollback, publicação, tracing, avaliação, otimização, monitoramento e integração com o Application Insights
      - Publicação de agentes no Microsoft 365 Copilot, Teams, apps personalizados, serviços e no Entra Agent Registry
      - Requisitos rigorosos de conformidade, residência de dados, rede privada ou segurança
    watch_out_for:
      - Maior complexidade de implementação e tempo até gerar valor
      - Exige conhecimento de Azure e recursos de desenvolvimento
      - Agentes hospedados acrescentam responsabilidades de computação em contêiner, framework, protocolo e operação
      - Alguns recursos, incluindo ferramentas selecionadas, otimizador, A2A e partes da recuperação agêntica, podem estar em preview dependendo da versão da API, região e configuração
      - Use o Copilot Studio para fluxos departamentais low-code, automações com Dataverse/conectores personalizados e entrega rápida conduzida por criadores
      - Use o Agent Builder para agentes de conhecimento simples e no-code no Microsoft 365 Copilot
      - Use o Databricks Agent Bricks quando o conhecimento do agente forem dados de lakehouse governados no Unity Catalog e o time de plataforma de dados for o responsável pela construção

  databricks:
    headline: Databricks Agent Bricks
    description: Construa, avalie, governe e sirva agentes na plataforma de dados — fundamentados em tabelas e coleções de documentos governadas pelo Unity Catalog, com linhagem, avaliação e serving resolvidos onde os dados já estão
    resources_url: https://www.databricks.com/product/artificial-intelligence/agent-bricks
    scoring_summary: A escolha certa quando o valor do agente vem do lakehouse — dados corporativos governados, grandes coleções de documentos e o time que é dono deles.
    exploration_best_for: Crie agentes na sua plataforma de dados governada
    exploration_summary: >
      Escolha o Databricks Agent Bricks quando o conhecimento do agente estiver no seu lakehouse
      e não no Microsoft 365. Construtores gerenciados como Knowledge Assistant e Supervisor Agent
      criam agentes de domínio sobre dados e coleções de documentos do Unity Catalog, com avaliação,
      tracing e serving resolvidos na mesma plataforma que já governa os dados. Feito para times de
      plataforma de dados, cientistas de dados e engenheiros de IA.
    summary: >
      A escolha certa quando o agente precisa raciocinar sobre dados corporativos governados —
      construído, avaliado e servido ao lado do lakehouse, sob as mesmas permissões e linhagem
      que já cobrem os dados.
    first_party_label: Construtores e blocos do Agent Bricks
    first_party_agents:
      - label: Knowledge Assistant
        description: Assistente de domínio construído sobre seus documentos e dados governados por uma interface guiada, com ajuste de qualidade em vez de RAG feito à mão
        url: https://docs.databricks.com/aws/en/generative-ai/agent-bricks/
      - label: Supervisor Agent
        description: Orquestra múltiplos agentes, agentes de consulta a dados, funções do Unity Catalog, servidores MCP e agentes personalizados atrás de um único ponto de entrada
        url: https://docs.databricks.com/aws/en/generative-ai/agent-bricks/
      - label: Governança do Unity Catalog
        description: Um único modelo de permissão e linhagem para tabelas, documentos, funções e os agentes que os utilizam
        url: https://www.databricks.com/product/unity-catalog
      - label: Tracing e avaliação com MLflow
        description: Captura interações, chamadas de ferramentas e invocações de modelo, com pontuação por LLM-como-juiz, métricas personalizadas e ciclos de feedback humano
        url: https://mlflow.org/docs/latest/llms/index.html
      - label: Model serving e Databricks Apps
        description: Serve agentes como endpoints REST escaláveis ou apps serverless, sem gerenciar infraestrutura
        url: https://www.databricks.com/product/artificial-intelligence/agent-bricks
      - label: Suporte a Model Context Protocol (MCP)
        description: Conecta agentes a APIs, bancos de dados e ferramentas SaaS por um contrato padrão de integração com autenticação unificada
        url: https://www.databricks.com/product/artificial-intelligence/agent-bricks
    best_for:
      - Times de plataforma de dados, cientistas de dados e engenheiros de IA que já rodam no Databricks
      - Agentes fundamentados em tabelas do Unity Catalog, tabelas Delta e grandes coleções de documentos governadas
      - Perguntas em linguagem natural sobre dados corporativos e extração estruturada de coleções de documentos em volume
      - Orquestração multiagente sobre agentes de dados, funções do Unity Catalog, servidores MCP e agentes personalizados
      - Cenários em que governança, permissões e linhagem precisam cobrir o agente e seus dados com um único modelo
      - Trabalho contínuo de qualidade — conjuntos de avaliação, pontuação por LLM-como-juiz, tracing e feedback humano antes e depois do lançamento
      - Servir agentes como endpoints REST ou apps serverless consumidos por aplicações personalizadas
    watch_out_for:
      - Exige um workspace Databricks, Unity Catalog e capacidade de serving — não é um complemento do Microsoft 365
      - Sem fundamentação nativa em conteúdo do Microsoft 365 — SharePoint, OneDrive, Teams e Outlook são acessados pelas plataformas Microsoft
      - Sem publicação nativa no chat do Microsoft 365 Copilot; coloque um agente do Copilot Studio ou do Foundry na frente quando os funcionários precisarem acessá-lo pelo Teams ou pelo Copilot
      - O catálogo de conectores do Microsoft 365 Copilot não se aplica — as integrações passam por MCP, APIs ou seus próprios pipelines
      - Preço por uso em serving, computação e avaliação pode crescer rápido sem governança de custos
      - Acrescenta uma segunda plataforma de agentes para operar se a sua organização já está padronizando em Copilot Studio ou Foundry
      - A disponibilidade dos componentes varia por nuvem, região e configuração do workspace — confirme antes de se comprometer

  # ---------------------------------------------------------------------------
  # Pontos de entrada de agentes prontos (somente no wizard de ponto de entrada) —
  # Cowork e Scout são lugares aonde o usuário final vai para realizar trabalho, e não
  # plataformas nas quais você cria agentes. (O terceiro destino do wizard, o
  # Microsoft 365 Copilot, está definido acima porque também é uma plataforma do
  # wizard pontuado.) Eles NÃO fazem parte do wizard pontuado e nunca aparecem em
  # meta.platforms. São alcançados apenas pelo caminho de prescreen
  # "Me ajude a encontrar o lugar certo para realizar meu trabalho", que pergunta sobre o
  # padrão de trabalho (participação, cadência, alcance) em vez de nomes de produto.
  # ---------------------------------------------------------------------------

  cowork:
    headline: Copilot Cowork
    description: Um agente pronto dentro do Microsoft 365 Copilot que planeja e conclui trabalhos de várias etapas em seu nome — e pode ser estendido com skills e plugins personalizados
    resources_url: https://learn.microsoft.com/microsoft-365/copilot/cowork/
    scoring_summary: Ideal para delegar sob demanda uma entrega delimitada de várias etapas no Microsoft 365.
    exploration_best_for: Delegue trabalhos de várias etapas no Microsoft 365 sob demanda
    exploration_summary: >
      O Cowork atua como seu delegado de IA dentro do Microsoft 365 Copilot — você descreve um
      resultado, ele cria um plano, executa as etapas e pausa para aprovação antes de ações
      sensíveis. Ideal para preparação de reuniões, organização de caixa de entrada e agenda,
      pesquisa aprofundada e conjuntos coordenados de documentos, com pontos de checagem humanos.
    summary: >
      Delegue um resultado definido, de várias etapas, no Microsoft 365 e receba o pacote de
      trabalho concluído — com aprovações e pontos de checagem antes de ações sensíveis.
    best_for:
      - Delegar sob demanda uma entrega delimitada de várias etapas no Microsoft 365
      - Pacotes de reunião, organização de caixa de entrada e agenda, pesquisa aprofundada, conjuntos coordenados de documentos
      - Controle com humano no circuito — atualizações de progresso, pontos de aprovação, pausar/retomar/cancelar
      - Fundamentado no seu contexto do Microsoft 365 (e-mail, reuniões, arquivos, mensagens) via Work IQ
      - Ampliação da experiência com skills e plugins personalizados
    watch_out_for:
      - Sob demanda e iniciado pelo usuário — não é sempre ativo nem monitora proativamente
      - Centrado no Microsoft 365 — sem runtime de desktop, shell, navegador ou arquivos locais
      - Cobrança por uso via Copilot Credits
      - Ações como enviar e-mail ou publicar no Teams exigem aprovação explícita
      - Use o Microsoft 365 Copilot (Copilot Chat) quando quiser apenas perguntar e iterar você mesmo
      - Use o Scout quando o trabalho precisar rodar continuamente ou ir além do Microsoft 365

  scout:
    headline: Microsoft Scout
    description: Um aplicativo desktop de Autopilot pessoal, sempre ativo, que trabalha de forma autônoma nos seus arquivos, shell, navegador e Microsoft 365 — e pode ser estendido com skills e plugins personalizados
    resources_url: https://learn.microsoft.com/microsoft-scout/overview
    scoring_summary: Ideal para acompanhamento proativo e sempre ativo no desktop, navegador e Microsoft 365.
    exploration_best_for: Um agente autônomo pessoal sempre ativo
    exploration_summary: >
      O Scout é o primeiro Autopilot da Microsoft — um agente pessoal sempre ativo, com identidade
      própria, que trabalha de forma autônoma em arquivos, shell, navegador e Microsoft 365,
      inclusive em segundo plano por agendamentos ou gatilhos. Ideal para monitoramento proativo,
      coordenação e acompanhamento que atravessam os ambientes local e de nuvem. Atualmente em
      preview do Frontier.
    summary: >
      Um Autopilot sempre ativo que mantém o trabalho andando de forma proativa no desktop,
      navegador, arquivos locais e Microsoft 365 — mesmo quando você não está pedindo nada.
    best_for:
      - Acompanhamento contínuo e proativo, em vez de tarefas pontuais
      - Trabalho agendado ou disparado por condições, via modo heartbeat e automações
      - Agir sobre arquivos locais, comandos de shell, automação de navegador, código e Microsoft 365
      - Delegar trabalho a subagentes especializados
      - Monitorar riscos como decisões travadas e entregas próximas do prazo
      - Ampliação da experiência com skills e plugins personalizados
    watch_out_for:
      - Preview do Frontier — recursos, acesso e detalhes de comercialização podem mudar
      - Restrito por inscrição no Frontier, política do Intune, atestação e licenciamento do GitHub Copilot
      - Aplicativo desktop para Windows e macOS
      - Ações sensíveis (enviar e-mail, gravar arquivos, executar comandos) exigem aprovação
      - Use o Cowork quando o trabalho for uma entrega delimitada do Microsoft 365 feita sob demanda
      - Use o Microsoft 365 Copilot (Copilot Chat) quando quiser apenas perguntar e iterar você mesmo

